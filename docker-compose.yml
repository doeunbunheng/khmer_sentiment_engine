services:
  db:
    image: postgres:16-alpine
    container_name: khmer_sentiment_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: khmer_sentiment
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d khmer_sentiment"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
